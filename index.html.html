<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدقة جارية - الحاج حمدي الحلوجي</title>
    <!-- استدعاء الخطوط العربية -->
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none; /* منع تحديد النصوص عند الضغط المتكرر */
            -webkit-tap-highlight-color: transparent;
        }
        body {
            background-color: #0b261a; /* لون أخضر داكن */
            color: #ffffff;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
            position: relative;
        }
        /* زخرفة إسلامية خفيفة في الخلفية */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: url('data:image/svg+xml;utf8,<svg width="40" height="40" viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg"><path d="M20 0l20 20-20 20L0 20z" fill="rgba(255,255,255,0.02)" fill-rule="evenodd"/></svg>');
            z-index: 1;
        }
        .container {
            text-align: center;
            padding: 20px;
            width: 100%;
            max-width: 500px;
            z-index: 10;
        }
        .image-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 4px solid #d4af37; /* لون ذهبي */
            padding: 4px;
            background-color: #0b261a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5), 0 0 15px rgba(212, 175, 55, 0.2);
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .title {
            font-size: 1.1rem;
            color: #d4af37; /* لون ذهبي */
            margin-bottom: 5px;
            font-weight: 600;
        }
        .name {
            font-size: 1.8rem;
            color: #ffffff;
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .dua-card {
            background-color: #ffffff;
            color: #111111;
            padding: 35px 25px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d4af37; /* إطار ذهبي للكارت */
            transition: opacity 0.5s ease-in-out;
            position: relative;
        }
        .dua-card::before, .dua-card::after {
            content: '"';
            position: absolute;
            font-family: 'Amiri', serif;
            font-size: 4rem;
            color: rgba(212, 175, 55, 0.2);
            line-height: 1;
        }
        .dua-card::before {
            top: 10px;
            right: 20px;
        }
        .dua-card::after {
            bottom: -15px;
            left: 20px;
        }
        .dua-text {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            line-height: 1.8;
            font-weight: bold;
            color: #0b261a;
        }
        .footer {
            margin-top: 40px;
            font-size: 1rem;
            color: #ffffff;
            opacity: 0.9;
            font-weight: 600;
            animation: pulse 2s infinite ease-in-out;
            background-color: rgba(0,0,0,0.3);
            padding: 8px 20px;
            border-radius: 50px;
            display: inline-block;
        }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 10px rgba(255,255,255,0.5); }
            100% { transform: scale(1); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- الصورة يتم سحبها من الملف المرفق في نفس المجلد -->
        <div class="image-container">
            <img src="dad.jpg" alt="الحاج حمدي الحلوجي" onerror="this.src='https://placehold.co/140x140/d4af37/ffffff?text=صورة+الوالد';">
        </div>
        
        <div class="title">الصدقة الجارية لروح المغفور له بإذن الله</div>
        <div class="name">الحاج حمدي الحلوجي</div>

        <div class="dua-card" id="duaCard">
            <div class="dua-text" id="duaText">
                اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ.
            </div>
        </div>

        <div class="footer">
            اضغط على الشاشة لقراءة دعاء آخر
        </div>
    </div>

    <script>
        // مصفوفة تحتوي على 20 دعاء للمتوفي
        const duaas = [
            "اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ.",
            "اللَّهُمَّ اجْعَلْ قَبْرَهُ رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ، وَلَا تَجْعَلْهُ حُفْرَةً مِنْ حُفَرِ النَّارِ.",
            "اللَّهُمَّ أَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، وَأَدْخِلْهُ الْجَنَّةَ.",
            "اللَّهُمَّ آنِسْ وَحْشَتَهُ، وَارْحَمْ غُرْبَتَهُ، وَقِهِ عَذَابَ الْقَبْرِ وَعَذَابَ النَّارِ.",
            "اللَّهُمَّ نَقِّهِ مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ.",
            "اللَّهُمَّ اجْعَلْهُ فِي الْفِرْدَوْسِ الْأَعْلَى مِنَ الْجَنَّةِ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ وَالصَّالِحِينَ.",
            "اللَّهُمَّ ارْزُقْهُ شَفَاعَةَ نَبِيِّكَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ وَاسْقِهِ مِنْ يَدِهِ شَرْبَةً هَنِيئَةً لَا يَظْمَأُ بَعْدَهَا أَبَدًا.",
            "اللَّهُمَّ اجْعَلْ عَمَلَهُ الصَّالِحَ أَنِيسًا لَهُ فِي قَبْرِهِ، وَنُورًا يُضِيءُ لَهُ ظُلْمَتَهُ.",
            "اللَّهُمَّ افْسَحْ لَهُ فِي قَبْرِهِ مَدَّ بَصَرِهِ، وَافْرِشْ قَبْرَهُ مِنْ فِرَاشِ الْجَنَّةِ.",
            "اللَّهُمَّ يَمِّنْ كِتَابَهُ، وَيَسِّرْ حِسَابَهُ، وَثَقِّلْ بِالْحَسَنَاتِ مِيزَانَهُ، وَثَبِّتْ عَلَى الصِّرَاطِ أَقْدَامَهُ.",
            "اللَّهُمَّ ثَبِّتْهُ بِالْقَوْلِ الثَّابِتِ فِي الْآخِرَةِ، وَثَبِّتْهُ يَوْمَ تَزِلُّ الْأَقْدَامُ.",
            "اللَّهُمَّ إِنَّهُ كَانَ يَشْهَدُ أَنَّكَ لَا إِلَهَ إِلَّا أَنْتَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ، وَأَنْتَ أَعْلَمُ بِهِ فَاغْفِرْ لَهُ.",
            "اللَّهُمَّ ارْحَمْهُ تَحْتَ الْأَرْضِ، وَاسْتُرْهُ يَوْمَ الْعَرْضِ، وَلَا تُخْزِهِ يَوْمَ يُبْعَثُونَ يَوْمَ لَا يَنْفَعُ مَالٌ وَلَا بَنُونَ.",
            "اللَّهُمَّ اجْعَلْهُ مِمَّنْ يُبَشَّرُونَ بِرَوْحٍ وَرَيْحَانٍ، وَرَبٍّ غَيْرِ غَضْبَانٍ.",
            "اللَّهُمَّ عَامِلْهُ بِمَا أَنْتَ أَهْلُهُ، وَلَا تُعَامِلْهُ بِمَا هُوَ أَهْلُهُ، إِنَّكَ أَهْلُ التَّقْوَى وَأَهْلُ الْمَغْفِرَةِ.",
            "اللَّهُمَّ اجْزِهِ عَنِ الْإِحْسَانِ إِحْسَانًا، وَعَنِ الْإِسَاءَةِ عَفْوًا وَغُفْرَانًا.",
            "اللَّهُمَّ إِنْ كَانَ مُحْسِنًا فَزِدْ فِي حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئًا فَتَجَاوَزْ عَنْ سَيِّئَاتِهِ.",
            "اللَّهُمَّ احْشُرْهُ مَعَ الْمُتَّقِينَ إِلَى الرَّحْمَنِ وَفْدًا، وَاجْعَلْهُ فِي زُمْرَةِ الْمُقَرَّبِينَ.",
            "اللَّهُمَّ ارْزُقْهُ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ الْكَرِيمِ، وَالشَّوْقَ إِلَى لِقَائِكَ.",
            "اللَّهُمَّ أَطْعِمْهُ مِنْ ثِمَارِ الْجَنَّةِ، وَاكْسُهُ مِنْ حَرِيرِهَا، وَاجْعَلْهُ مِنَ الْمُنَعَّمِينَ فِيهَا."
        ];

        let currentIndex = 0;
        const duaCard = document.getElementById('duaCard');
        const duaText = document.getElementById('duaText');

        // دالة تغيير الدعاء
        function changeDuaa() {
            // إخفاء الكارت مؤقتاً
            duaCard.style.opacity = 0;
            
            // الانتظار نصف ثانية حتى يختفي تماماً ثم تغيير النص
            setTimeout(() => {
                let newIndex;
                // حلقة لضمان عدم اختيار نفس الدعاء الحالي مرة أخرى
                do {
                    newIndex = Math.floor(Math.random() * duaas.length);
                } while (newIndex === currentIndex);
                
                currentIndex = newIndex;
                duaText.innerText = duaas[currentIndex];
                
                // إظهار الكارت مرة أخرى
                duaCard.style.opacity = 1;
            }, 500);
        }

        // تنفيذ التغيير عند الضغط على أي مكان في الشاشة
        document.body.addEventListener('click', changeDuaa);
    </script>
</body>
</html>
