<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صدقة جارية - الحاج حمدي الحلوجي</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #0b261a;
            background-image: url('https://www.transparenttextures.com/patterns/arabesque.png');
            color: #fff;
            font-family: 'Cairo', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            overflow: hidden;
        }
        .container {
            text-align: center;
            padding: 20px;
            max-width: 90%;
            width: 400px;
            z-index: 10;
        }
        .image-container {
            width: 140px;
            height: 140px;
            margin: 0 auto 15px;
            border-radius: 50%;
            border: 4px solid #d4af37;
            padding: 3px;
            background-color: #0b261a;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            overflow: hidden;
        }
        .image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .title {
            font-size: 1.1rem;
            color: #d4af37;
            margin-bottom: 5px;
            font-weight: 600;
        }
        .name {
            font-size: 1.6rem;
            color: #fff;
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 1px 1px 5px rgba(0,0,0,0.5);
        }
        .dua-card {
            background-color: rgba(255, 255, 255, 0.95);
            color: #000;
            padding: 30px 20px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            min-height: 200px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #d4af37;
            transition: opacity 0.5s ease-in-out;
        }
        .dua-text {
            font-family: 'Amiri', serif;
            font-size: 1.6rem;
            line-height: 1.8;
            color: #1a1a1a;
            font-weight: bold;
        }
        .footer {
            margin-top: 40px;
            font-size: 0.9rem;
            color: #a3c2b1;
            opacity: 0.8;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="image-container">
            <img src="dad.jpg.jpeg" alt="الحاج حمدي الحلوجي">
        </div>
        
        <div class="title">الصدقة الجارية لروح المغفور له بإذن الله</div>
        <div class="name">الحاج حمدي الحلوجي</div>

        <div class="dua-card" id="duaCard">
            <div class="dua-text" id="duaText">
                اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ، وَاغْسِلْهُ بِالْمَاءِ وَالثَّلْجِ وَالْبَرَدِ.
            </div>
        </div>

        <div class="footer">
            اضغط على الشاشة لقراءة دعاء آخر
        </div>
    </div>

    <script>
        const duaas = [
            "اللَّهُمَّ اغْفِرْ لَهُ وَارْحَمْهُ وَعَافِهِ وَاعْفُ عَنْهُ، وَأَكْرِمْ نُزُلَهُ، وَوَسِّعْ مُدْخَلَهُ.",
            "اللَّهُمَّ اجْعَلْ قَبْرَهُ رَوْضَةً مِنْ رِيَاضِ الْجَنَّةِ، وَلَا تَجْعَلْهُ حُفْرَةً مِنْ حُفَرِ النَّارِ.",
            "اللَّهُمَّ أَبْدِلْهُ دَارًا خَيْرًا مِنْ دَارِهِ، وَأَهْلًا خَيْرًا مِنْ أَهْلِهِ، وَأَدْخِلْهُ الْجَنَّةَ.",
            "اللَّهُمَّ آنِسْ وَحْشَتَهُ، وَارْحَمْ غُرْبَتَهُ، وَقِهِ عَذَابَ الْقَبْرِ وَعَذَابَ النَّارِ.",
            "اللَّهُمَّ نَقِّهِ مِنَ الْخَطَايَا كَمَا يُنَقَّى الثَّوْبُ الْأَبْيَضُ مِنَ الدَّنَسِ.",
            "اللَّهُمَّ اجْعَلْهُ فِي الْفِرْدَوْسِ الْأَعْلَى مِنَ الْجَنَّةِ مَعَ النَّبِيِّينَ وَالصِّدِّيقِينَ وَالشُّهَدَاءِ.",
            "اللَّهُمَّ ارْزُقْهُ شَفَاعَةَ نَبِيِّكَ مُحَمَّدٍ صَلَّى اللَّهُ عَلَيْهِ وَسَلَّمَ.",
            "اللَّهُمَّ اجْعَلْ عَمَلَهُ الصَّالِحَ أَنِيسًا لَهُ فِي قَبْرِهِ.",
            "اللَّهُمَّ افْسَحْ لَهُ فِي قَبْرِهِ مَدَّ بَصَرِهِ، وَافْرِشْ قَبْرَهُ مِنْ فِرَاشِ الْجَنَّةِ.",
            "اللَّهُمَّ يَمِّنْ كِتَابَهُ، وَيَسِّرْ حِسَابَهُ، وَثَقِّلْ بِالْحَسَنَاتِ مِيزَانَهُ.",
            "اللَّهُمَّ ثَبِّتْهُ عَلَى الصِّرَاطِ يَوْمَ تَزِلُّ الْأَقْدَامُ.",
            "اللَّهُمَّ إِنَّهُ كَانَ يَشْهَدُ أَنَّكَ لَا إِلَهَ إِلَّا أَنْتَ، وَأَنَّ مُحَمَّدًا عَبْدُكَ وَرَسُولُكَ، فَاغْفِرْ لَهُ.",
            "اللَّهُمَّ ارْحَمْهُ تَحْتَ الْأَرْضِ، وَاسْتُرْهُ يَوْمَ الْعَرْضِ، وَلَا تُخْزِهِ يَوْمَ يُبْعَثُونَ.",
            "اللَّهُمَّ اجْعَلْهُ مِمَّنْ يُبَشَّرُونَ بِرَوْحٍ وَرَيْحَانٍ، وَرَبٍّ غَيْرِ غَضْبَانٍ.",
            "اللَّهُمَّ عَامِلْهُ بِمَا أَنْتَ أَهْلُهُ، وَلَا تُعَامِلْهُ بِمَا هُوَ أَهْلُهُ.",
            "اللَّهُمَّ اجْزِهِ عَنِ الْإِحْسَانِ إِحْسَانًا، وَعَنِ الْإِسَاءَةِ عَفْوًا وَغُفْرَانًا.",
            "اللَّهُمَّ إِنْ كَانَ مُحْسِنًا فَزِدْ فِي حَسَنَاتِهِ، وَإِنْ كَانَ مُسِيئًا فَتَجَاوَزْ عَنْ سَيِّئَاتِهِ.",
            "اللَّهُمَّ احْشُرْهُ مَعَ الْمُتَّقِينَ إِلَى الرَّحْمَنِ وَفْدًا.",
            "اللَّهُمَّ ارْزُقْهُ لَذَّةَ النَّظَرِ إِلَى وَجْهِكَ الْكَرِيمِ.",
            "اللَّهُمَّ أَطْعِمْهُ مِنْ ثِمَارِ الْجَنَّةِ، وَاسْقِهِ مِنْ نَهَرِ الْكَوْثَرِ شَرْبَةً لَا يَظْمَأُ بَعْدَهَا أَبَدًا."
        ];

        let currentIndex = 0;
        const duaCard = document.getElementById('duaCard');
        const duaText = document.getElementById('duaText');

        document.body.addEventListener('click', function() {
            duaCard.style.opacity = 0;
            
            setTimeout(() => {
                let newIndex;
                do {
                    newIndex = Math.floor(Math.random() * duaas.length);
                } while (newIndex === currentIndex);
                
                currentIndex = newIndex;
                duaText.innerText = duaas[currentIndex];
                duaCard.style.opacity = 1;
            }, 500); 
        });
    </script>
</body>
</html>
